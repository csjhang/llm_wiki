# Example only. Do not edit this file.
# Run `wiki-tool hepta init` to create the real `heptabase.yaml` for your wiki.
# Every ID below is a placeholder. Real IDs come from your own Heptabase space.
# All IDs are lowercase UUIDs.
# This file holds Heptabase settings only. The id and the role of the wiki are in `wiki.yaml`.
version: 1

roots:                        # Cards under these whiteboards belong to this wiki.
  - 00000000-0000-4000-8000-000000000001

whiteboards:                  # The kind of each whiteboard. A whiteboard not listed here is a topic.
  00000000-0000-4000-8000-000000000002: { kind: topic }
  00000000-0000-4000-8000-000000000003: { kind: source, auto_ingest: false }   # auto_ingest is allowed only for kind source.
  00000000-0000-4000-8000-000000000004: { kind: project }
  00000000-0000-4000-8000-000000000005: { kind: archive }                      # An archive whiteboard is not synced.

tags:
  ingest: 00000000-0000-4000-8000-000000000006   # The user adds this tag to a card to put it in the wiki.
  mirror: 00000000-0000-4000-8000-000000000007   # The tag of the mirror cards (#wiki).

properties:                   # The IDs of the properties of the #wiki tag.
  domain: 00000000-0000-4000-8000-000000000008              # Required.
  page_type: 00000000-0000-4000-8000-000000000009           # Required.
  wiki: 00000000-0000-4000-8000-000000000010                # Required. The value on a card is the `id` in `wiki.yaml`.
  status: 00000000-0000-4000-8000-000000000011              # Required.
  wiki_page: 00000000-0000-4000-8000-000000000012           # Optional.
  last_synced: 00000000-0000-4000-8000-000000000013         # Optional.
  hypothesis_status: 00000000-0000-4000-8000-000000000014   # Optional.
  strength: 00000000-0000-4000-8000-000000000015            # Optional.
